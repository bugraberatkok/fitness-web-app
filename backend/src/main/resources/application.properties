spring.application.name=fitnessapp

# H2 Database Config (Dosya tabanlı, SQLite mantığı)
spring.datasource.url=jdbc:h2:file:./data/fitnessdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Tarayıcıdan DB'ye bakabilmek için, localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security (JWT)
# Anahtar koda yazılmaz; JWT_SECRET ortam değişkeninden (en az 32 karakter) okunur.
# Tanımlı değilse uygulama açılışta rastgele bir anahtar üretir (lokal geliştirme için yeterli).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
